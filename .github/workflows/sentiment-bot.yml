name: Sentiment Bot Cycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one bot cycle
        run: python run_once.py

      - name: Commit updated state files
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add sentiment_log.csv trade_log.csv seen_items.json recent_scores.json last_trade.json
          git diff --staged --quiet || git commit -m "bot cycle: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
