name: Sentiment Bot Cycle

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one bot cycle
        run: python run_once.py

      - name: Commit updated state files
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          for f in sentiment_log.csv seen_items.json recent_scores.json trade_log.csv last_trade.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "bot cycle: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              echo "Push failed, retry $i..."
              sleep $((RANDOM % 10 + 1))
            done
          fi
